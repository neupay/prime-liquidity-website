name: Build, Push, and Deploy Next.js 16 App

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Handle Build-time Secrets ---
      # Create a .env file with build-time args for the build step.
      # NEVER store real secrets here. Use GitHub Secrets.
      - name: Create .env file for build-time args
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env.production
          echo "NEXT_PUBLIC_ANALYTICS_ID=${{ secrets.NEXT_PUBLIC_ANALYTICS_ID }}" >> .env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Cache layers to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Use a secret mount for build-time variables instead of embedding them
          # This prevents them from being part of the image history if misconfigured.
          # Alternatively, you can use build-args for non-sensitive public vars.
          # For simplicity, we use a secret mount with a file.
          secrets: |
            "env_file=.env.production"